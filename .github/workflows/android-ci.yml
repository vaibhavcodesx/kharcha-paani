name: Android CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle doesn't
      # have to download a second JDK for its daemon.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # No .env on CI: the Secrets plugin falls back to .env.example placeholders, which is all
      # the unit tests need. Robolectric's Android jars download on first run.
      # Also compiles the on-device tests, which CI can't run (no emulator), so they can't rot
      # unnoticed between the releases they're run for.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
