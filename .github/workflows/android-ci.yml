name: Android CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a tag: a tag can be moved to different code after review.
# Dependabot (.github/dependabot.yml) proposes the updates.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle doesn't
      # have to download a second JDK for its daemon.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No .env on CI: the Secrets plugin falls back to .env.example placeholders, which is all
      # the unit tests need. Robolectric's Android jars download on first run.
      # Also compiles the on-device tests, which CI can't run (no emulator), so they can't rot
      # unnoticed between the releases they're run for.
      - name: Unit tests
        run: |
          diagnostics="$PWD/app/build/test-diagnostics"
          init_script=""
          watchdog_pid=""
          init_args=()
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n "$watchdog_pid" ]]; then
              kill "$watchdog_pid" 2>/dev/null || true
            fi
            if [[ -n "$init_script" ]]; then
              rm -f -- "$init_script" || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if init_script="$(mktemp "$RUNNER_TEMP/kp-test-logging.XXXXXX.gradle")"; then
            if cat > "$init_script" <<'GRADLE'
          gradle.projectsEvaluated {
              gradle.rootProject.allprojects { project ->
                  project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { testTask ->
                      testTask.testLogging.events("started", "failed", "skipped")
                  }
              }
          }
          GRADLE
            then
              init_args=(-I "$init_script")
            else
              printf 'Could not write diagnostic init script; running the original Gradle tasks.\n' >&2
            fi
          else
            printf 'Could not create diagnostic init script; running the original Gradle tasks.\n' >&2
          fi
          if mkdir -p "$diagnostics"; then
            (
              for round in 1 2 3 4 5; do
                sleep 300
                printf 'Diagnostic round %s at %s\n' "$round" "$(date -u +%FT%TZ)"
                listing="$diagnostics/jcmd-list-$round.txt"
                if ! timeout 15s jcmd -l > "$listing" 2>&1; then
                  printf 'jcmd listing failed or timed out in round %s; see %s\n' "$round" "$listing"
                  continue
                fi
                while read -r pid; do
                  [[ "$pid" =~ ^[0-9]+$ ]] || continue
                  if ! timeout 15s jcmd "$pid" Thread.print > "$diagnostics/threads-$round-$pid.txt" 2>&1; then
                    printf 'Thread dump failed or timed out for worker %s in round %s\n' "$pid" "$round"
                  fi
                done < <(awk '$1 ~ /^[0-9]+$/ && /GradleWorkerMain/ { print $1 }' "$listing")
              done
            ) > "$diagnostics/watchdog.log" 2>&1 &
            watchdog_pid=$!
          else
            printf 'Could not create diagnostic directory; running the original Gradle tasks.\n' >&2
          fi
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin "${init_args[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-diagnostics/
          retention-days: 14

  # Lint on the variant that ships. Issues already in the code are recorded in
  # app/lint-baseline.xml, so this fails on new ones only.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Lint the release variant
        run: ./gradlew :app:lintRelease

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-release.*
            app/lint-baseline.xml
          retention-days: 14

  # The release variant has to build on every PR, not just on release day: it's the one with R8
  # and the one nobody runs while developing. Unsigned, since CI holds no key; release.yml signs.
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the unsigned release bundle
        run: ./gradlew :app:bundleRelease

      - name: Upload the R8 mapping
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
