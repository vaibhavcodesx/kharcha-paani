name: Release APK

# Manual only. Never on push — a release is a decision, not a side effect of committing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0 (must match versionName in app/build.gradle.kts)'
        required: true
        type: string
      omit_ai_key:
        description: 'Build without the Gemini key (AI section hidden). Use for wider sharing.'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # All history and tags, to compare versionCode with the last release's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The tag is the release's identity, so it has to agree with what the APK will report.
      # Catching this here costs seconds; catching it after publishing means deleting a release.
      - name: Check the tag matches versionName
        run: |
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          expected="v${version_name}"
          if [ "${{ inputs.tag }}" != "$expected" ]; then
            echo "::error::Tag '${{ inputs.tag }}' does not match versionName '$version_name' (expected '$expected')."
            echo "Bump versionName and versionCode in app/build.gradle.kts, or pass the matching tag."
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_ENV"

      # Android installs an update only if versionCode went up, and Play refuses a repeat. The last
      # release is the newest v* tag that isn't this one.
      - name: Check versionCode went up since the last release
        run: |
          code_at() { grep -oP 'versionCode\s*=\s*\K[0-9]+' ; }
          current=$(code_at < app/build.gradle.kts)
          previous_tag=$(git tag -l 'v*' --sort=-v:refname | grep -vx "${{ inputs.tag }}" | head -1)
          if [ -z "$previous_tag" ]; then
            echo "No earlier release tag; versionCode $current."
            exit 0
          fi
          previous=$(git show "$previous_tag:app/build.gradle.kts" | code_at)
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode is $current, but $previous_tag shipped $previous. Bump it in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode $previous ($previous_tag) -> $current"

      # The same unit tests as every PR, on exactly the commit being released.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Written, used and deleted within this job. Secrets are masked in logs by Actions.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See README > Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The Secrets Gradle Plugin reads .env; without it every BuildConfig value falls back to the
      # placeholders in .env.example and the shipped app cannot reach Supabase.
      - name: Write .env from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > .env
          if [ "${{ inputs.omit_ai_key }}" = "true" ]; then
            echo "Building without the Gemini key: the AI section will be hidden."
          else
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          # Crash reports (plan T1.6): only with all three. Without them the placeholders in
          # .env.example apply and the build never reports.
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            {
              echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
              echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
              echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            } >> .env
          else
            echo "::notice::No Firebase secrets: this build sends no crash reports."
          fi

      # The APK for direct installs, and the bundle (AAB) Play takes, from one build.
      - name: Build the signed release APK and bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.omit_ai_key }}" = "true" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease -PomitAiKey
          else
            ./gradlew :app:assembleRelease :app:bundleRelease
          fi

      # assembleRelease leaves the APK unsigned rather than failing when credentials are missing,
      # so "it built" is not the same as "it is installable". This is the check that it is.
      - name: Verify the APK is signed
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "apk_path=$apk" >> "$GITHUB_ENV"

      # Not -strict: on JDK 25 it fails every bundle with "signed in JarFile but is not signed in
      # JarInputStream", a warning about the AAB's entry order (the 1.5.0 run hit it). An unsigned
      # bundle never prints "jar verified", so that is what's checked.
      - name: Verify the bundle is signed
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/jarsigner.txt"
          grep -q "^jar verified" "$RUNNER_TEMP/jarsigner.txt"
          echo "aab_path=$aab" >> "$GITHUB_ENV"

      - name: Name the files after the release
        run: |
          suffix=""
          if [ "${{ inputs.omit_ai_key }}" = "true" ]; then suffix="-no-ai"; fi
          final="KharchaPaani-${{ inputs.tag }}${suffix}.apk"
          cp "$apk_path" "$final"
          echo "final_apk=$final" >> "$GITHUB_ENV"
          final_aab="KharchaPaani-${{ inputs.tag }}${suffix}.aab"
          cp "$aab_path" "$final_aab"
          echo "final_aab=$final_aab" >> "$GITHUB_ENV"
          # With R8 on, crash stack traces from this release can only be read with its mapping.
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then
            cp "$mapping" "KharchaPaani-${{ inputs.tag }}${suffix}-mapping.txt"
            echo "final_mapping=KharchaPaani-${{ inputs.tag }}${suffix}-mapping.txt" >> "$GITHUB_ENV"
          fi

      - name: Clean up the keystore and .env
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" .env

      - name: Create the GitHub Release and attach the APK, bundle and mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install: download the APK below, open it on your phone, and allow installation from this source when Android asks."
          if [ "${{ inputs.omit_ai_key }}" = "true" ]; then
            notes="$notes

            This build ships without a Gemini API key, so the AI features (Ask about your money, Read this trip, statement scanning) are hidden. Everything else works."
          fi
          gh release create "${{ inputs.tag }}" "$final_apk" "$final_aab" ${final_mapping:+"$final_mapping"} \
            --title "Kharcha Paani ${{ inputs.tag }}" \
            --notes "$notes" \
            --target "${{ github.sha }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }}
